<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Crop Analysis | Farming</title>

    <!-- Flask CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- Navigation -->
    <header>

        <div class="logo">
            🌱 Farming
        </div>

        <nav>

            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('history') }}">
                History
            </a>

            <a href="{{ url_for('profile') }}">
                Profile
            </a>

        </nav>

    </header>


    <!-- Main -->
    <main>

        <section class="form-section">

            <div class="form-container crop-form">

                <h1>Crop Analysis</h1>

                <p class="form-description">
                    Enter your crop and soil information.
                </p>


                <!-- Crop Form -->
                <form id="cropForm"
                      method="POST"
                      action="{{ url_for('crop') }}"
                      enctype="multipart/form-data">


                    <!-- Crop -->
                    <div class="form-group">

                        <label for="crop">
                            Select Crop
                        </label>

                        <select id="crop"
                                name="crop"
                                required>

                            <option value="">
                                Select crop
                            </option>

                            <option value="rice">
                                Rice
                            </option>

                            <option value="wheat">
                                Wheat
                            </option>

                            <option value="maize">
                                Maize
                            </option>

                            <option value="cotton">
                                Cotton
                            </option>

                            <option value="tomato">
                                Tomato
                            </option>

                            <option value="potato">
                                Potato
                            </option>

                            <option value="groundnut">
                                Groundnut
                            </option>

                        </select>

                    </div>


                    <!-- Soil -->
                    <div class="form-group">

                        <label for="soil">
                            Soil Type
                        </label>

                        <select id="soil"
                                name="soil"
                                required>

                            <option value="">
                                Select soil type
                            </option>

                            <option value="loamy">
                                Loamy
                            </option>

                            <option value="clay">
                                Clay
                            </option>

                            <option value="sandy">
                                Sandy
                            </option>

                            <option value="black">
                                Black Soil
                            </option>

                            <option value="red">
                                Red Soil
                            </option>

                        </select>

                    </div>


                    <!-- Nitrogen -->
                    <div class="form-group">

                        <label for="nitrogen">
                            Nitrogen (N)
                        </label>

                        <input
                            type="number"
                            id="nitrogen"
                            name="nitrogen"
                            min="0"
                            placeholder="Enter nitrogen value"
                            required
                        >

                    </div>


                    <!-- Phosphorus -->
                    <div class="form-group">

                        <label for="phosphorus">
                            Phosphorus (P)
                        </label>

                        <input
                            type="number"
                            id="phosphorus"
                            name="phosphorus"
                            min="0"
                            placeholder="Enter phosphorus value"
                            required
                        >

                    </div>


                    <!-- Potassium -->
                    <div class="form-group">

                        <label for="potassium">
                            Potassium (K)
                        </label>

                        <input
                            type="number"
                            id="potassium"
                            name="potassium"
                            min="0"
                            placeholder="Enter potassium value"
                            required
                        >

                    </div>


                    <!-- Temperature -->
                    <div class="form-group">

                        <label for="temperature">
                            Temperature (°C)
                        </label>

                        <input
                            type="number"
                            id="temperature"
                            name="temperature"
                            step="0.1"
                            placeholder="Enter temperature"
                            required
                        >

                    </div>


                    <!-- Humidity -->
                    <div class="form-group">

                        <label for="humidity">
                            Humidity (%)
                        </label>

                        <input
                            type="number"
                            id="humidity"
                            name="humidity"
                            min="0"
                            max="100"
                            placeholder="Enter humidity"
                            required
                        >

                    </div>


                    <!-- pH -->
                    <div class="form-group">

                        <label for="ph">
                            Soil pH
                        </label>

                        <input
                            type="number"
                            id="ph"
                            name="ph"
                            step="0.1"
                            min="0"
                            max="14"
                            placeholder="Enter soil pH"
                            required
                        >

                    </div>


                    <!-- Rainfall -->
                    <div class="form-group">

                        <label for="rainfall">
                            Rainfall (mm)
                        </label>

                        <input
                            type="number"
                            id="rainfall"
                            name="rainfall"
                            min="0"
                            placeholder="Enter rainfall"
                            required
                        >

                    </div>


                    <!-- Crop Image -->
                    <div class="form-group">

                        <label for="cropImage">
                            Upload Crop Image
                        </label>

                        <input
                          type="file"
                          id="cropImage"
                         name="cropImage"
                         accept="image/*"
                         required
                        >

                    </div>


                    <!-- Image Preview -->
                    <div id="imagePreviewContainer">

                        <img
                            id="imagePreview"
                            src=""
                            alt="Crop preview"
                        >

                    </div>


                    <!-- Analyze Button -->
                    <button
                        type="submit"
                        class="primary-btn form-button"
                    >
                        Analyze Crop
                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Farming -
            Fertilizer &amp; Pesticide
            Recommendation System
        </p>

    </footer>


    <!-- Flask JavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
