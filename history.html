<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>History |  Farming</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Header -->
    <header>

        <div class="logo">
            🌱  Farming
        </div>

        <nav>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('crop') }}">New Analysis</a>
            <a href="{{ url_for('profile') }}">Profile</a>
        </nav>

    </header>


    <!-- Main Content -->
    <main>

        <section class="history-section">

            <h1>Analysis History</h1>

            <p>
                View your previous crop analysis results.
            </p>


            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Crop</th>
                            <th>Soil</th>
                            <th>Disease</th>
                            <th>Fertilizer</th>
                            <th>Pesticide</th>
                        </tr>
                    </thead>


                    <tbody id="historyTable">

                        <tr>
                            <td colspan="6">
                                No analysis history available.
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Farming -
            Fertilizer &amp; Pesticide Recommendation System
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
